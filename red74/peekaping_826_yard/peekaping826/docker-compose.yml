services:

  peekaping:
  #http://10.33.44.81:8383
    build:
      context: .
      dockerfile: Dockerfile.bundle.postgres
    restart: unless-stopped
    ports:
      - "8383:8383"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgres
      - DB_HOST=localhost
      - DB_PASS=pw77pg
      - DB_PORT=5432
    volumes:
      # Database data persistence
      - ./sysdata/postgres:/var/lib/postgresql/data
      # Application logs persistence
      - ./sysdata/logs:/var/log/supervisor
      # Optional: Custom Caddyfile override
      # - ./custom-Caddyfile:/etc/caddy/Caddyfile:ro
    #container_name: peekaping-bundle-postgres
