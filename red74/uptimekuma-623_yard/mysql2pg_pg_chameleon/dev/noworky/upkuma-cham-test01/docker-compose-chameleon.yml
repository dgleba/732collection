
# ------------  docker-compose-chameleon.yml

volumes:
  dbp-pg-data:

services:

  dbp:
    # docker rm upkuma-cham-test-dbp-1 ; docker volume rm  upkuma-cham-test_dbp-pg-data
    image: postgres:18-alpine
    #container_name: dbp
    restart: always
    env_file:
      - ./.env
    ports:
      - "5439:5432"
    volumes:
      - dbp-pg-data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 60s
      timeout: 12s
      retries: 10
      start_period: 10s
    networks:
      - default

  pgchameleon:
    # this should one run once.
    # no need.. docker volume rm upkuma-cham-test_pgcham-data
    # no no.. image: the4thdoctor/pgchameleon:latest
    build: ./pgchameleon
    restart: no
    depends_on:
      dbp:
        condition: service_healthy
      dbm:
        condition: service_healthy
    volumes:
      # - pgcham-data:/var/lib/pgchameleon
      - ./pgchameleon/config:/etc/pgchameleon
    env_file:
      - ./.env
    # healthcheck:
      # test: ["CMD-SHELL", "chameleon status c01 || exit 1"]
      # interval: 60s
      # timeout: 15s
      # retries: 10
      # start_period: 10s
    command: >
      sh -c "
        envsubst < /etc/pgchameleon/config-tmpl.yml > /etc/pgchameleon/config.yml &&
        chameleon setconf c01 &&
        chameleon create_replica c01 &&
        chameleon start_replica c01
      "
    networks:
      - default

