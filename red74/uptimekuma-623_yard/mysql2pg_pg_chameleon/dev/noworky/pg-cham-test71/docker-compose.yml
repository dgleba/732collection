services:

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    command:
      - --binlog-format=ROW
      - --binlog_row_image=FULL
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog_row_metadata=FULL
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpass"]
      interval: 10s
      retries: 5

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  #  docker-compose run --rm --user root pgchameleon    chown -R 1000:1000 /home/chameleon/.pg_chameleon
  pgchameleon:
    build:
      context: ./pgchameleon
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    #volumes:
      #- pgcham-home:/home/chameleon/.pg_chameleon
      #- ./pgchameleon/default.yml:/home/chameleon/.pg_chameleon/configuration/default.yml:ro
    command: >
        bash -c "
        mkdir -p /pgchamdir/logs /pgchamdir/pid &&
        rm -rf /pgchamdir/pid/* &&
        chameleon create_replica_schema --config default &&
        chameleon add_source --config default --source replica1 &&
        chameleon init_replica --config default --source replica1 &&
        chameleon start_replica --config default --source replica1 &&
        tail -F /pgchamdir/logs/default_replica1.log
        "

volumes:
  mysql-data:
  pg-data:
  pgcham-home:
  
  