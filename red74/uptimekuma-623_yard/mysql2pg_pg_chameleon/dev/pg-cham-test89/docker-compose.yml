
services:

  mysql:
    image: mariadb:10.11
    #container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    command:
      - --binlog-format=ROW
      - --binlog_row_image=FULL
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog_row_metadata = FULL
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpass"]
      interval: 30s
      retries: 3
      start_period: 40s
      
  postgres:
    image: postgres:15
    #container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      retries: 3
      start_period: 40s
      

  #  docker-compose run --rm --user root pgchameleon    chown -R 1000:1000 /home/chameleon/.pg_chameleon
  pgchameleon:
   build:
     context: ./pgchameleon
     #platform: linux/amd64
   depends_on:
     mysql:
       condition: service_healthy
     postgres:
       condition: service_healthy
   environment:
     - CHAMELEON_HOME=/pgchamdir
   volumes:
     - ./sysdata/pgcham-crib:/crib
     # perm problem...  - ./pgchameleon/config.yml:/home/chameleon/.pg_chameleon/configuration/default.yml:ro
     # - ./pgchameleon:/home/chameleon/.pg_chameleon/configuration/
     #
     # nonono... - pgcham-home:/home/chameleon/.pg_chameleon
     # no perm problems with logic how docker applies perms on startup..  - pgcham-data:/pgchamdir
     #- ./sysdata/pgchameleon_logs:/pgchamdir/logs
   command: >
        bash -c "
        echo "2.home = $HOME" &&
        mkdir -p /pgchamdir/logs /pgchamdir/pid &&
        chameleon setconf --source replica1 &&
                chameleon create_replica_schema && 
        chameleon create_replica_schema &&
        chameleon add_source --source replica1 &&
        chameleon create_replica --source replica1 &&
        chameleon start_replica --source replica1 &&
        tail -F /pgchamdir/logs/*.log || tail -f /dev/null
        "


volumes:
  mysql-data:
  pg-data:
  #pgcham-data:
  pgcham-home:

