{% load static %}
<html>
  <head>
    <title>Django Builder - djangoproj</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
    {% block extrahead %}{% endblock %}
  </head>

  <body hx-boost="true">


    {% block allcontent %}
    <div id="content" class="container" hx-get="{% url 'index' %}" hx-trigger="load, every 5s" >
      <h2>Home: <a href="{% url 'index' %}">djangoproj</a></h2>
      <div class="card">
        <div class="card-body">
          
          <p class="card-text">{% block content %}{% endblock %}</p>
        </div>
      </div>
    </div>
    <div class="container mt-3">
    <div class="card">
    <div class="card-body">
        <h5 class="card-title">WebSocket Messages</h5>
        <p class="card-text"><code id="messages"></code></p>

    </div>
    </div>
    <!-- Counter Display -->
      <p>Page reload count: <span id="reload-counter">0</span></p>
</div>
    {% endblock %}
  
  
  <script>
    var wsprotocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://'
    var ws = wsprotocol + window.location.hostname + ':' + window.location.port + '/ws/'
    var socket = new WebSocket(ws);

    socket.onopen = function() {
      // Web Socket is connected, send some text
      socket.send("Text from Javascript");
      // Send some binary data
      socket.send(new Blob(["Bytes from Javascript"]));
    };

    socket.onmessage = function (evt) { 
      console.log(evt)
      var received_msg = evt.data;
      console.log("Message received...", received_msg);
      var node = document.createElement("div");
      if (received_msg instanceof Blob) {
        received_msg.text().then(function (received_text) {
          var textnode = document.createTextNode("> " + received_text);
          node.appendChild(textnode);
          document.getElementById("messages").appendChild(node);
        })
      } else {
        var textnode = document.createTextNode("> " + received_msg);
        node.appendChild(textnode);
        document.getElementById("messages").appendChild(node);
      }
    };
    
    // Function to increment and display the reload counter
        function updateReloadCounter() {
            // Retrieve the current count from local storage
            let reloadCount = localStorage.getItem('reloadCount');

            // Initialize to zero if this is the first load
            if (reloadCount === null) {
                reloadCount = 0;
            }
            
            // Increment the reload count
            reloadCount++;

            // Save the updated count back to local storage
            localStorage.setItem('reloadCount', reloadCount);

            // Display the count
            document.getElementById('reload-counter').innerText = reloadCount;
        }

        // Call the function to update and display the reload counter on page load
        updateReloadCounter();
        
        // Set an interval to reload the page every 5 seconds (5000 milliseconds)
        setInterval(() => {
            // Reload the page
            location.reload();
        }, 985000);
        
  </script>
  
  </body>
</html>
